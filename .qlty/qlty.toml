# Qlty CLI configuration.
# This complements the repo's existing quality gates (eslint, prettier,
# typecheck, tests) without overlapping them: no eslint/prettier/biome plugins
# are enabled here. Qlty adds secrets scanning, dependency and IaC security,
# maintainability smells, unused-dependency detection and docs/Prisma linting.
#
# For a guide to configuration, visit https://qlty.sh/d/config
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/package-lock.json",
  "**/yarn.lock",
  "pnpm-lock.yaml",
  ".qlty/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

[[plugin]]
name = "gitleaks"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "knip"

[[plugin]]
name = "markdownlint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "prisma"

[[plugin]]
name = "yamllint"